name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Unit tests
        run: pytest -q

      - name: Smoke: synthesize + run a PE
        run: |
          wineless synth demo.exe "CI WORKS"
          wineless run demo.exe; echo "exit=$?"

  integration-jq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: Run the official jq.exe (Windows binary) on Linux
        run: |
          curl -sL -o jq.exe https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-windows-amd64.exe
          wineless info jq.exe | head -5
          out=$(wineless run jq.exe -- --version 2>/dev/null)
          echo "jq said: $out"
          [ "$out" = "jq-1.7.1" ] || { echo "unexpected jq output"; exit 1; }
